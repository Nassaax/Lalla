<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LALLAT</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #FAF6F0; color: #1E1412; font-family: -apple-system, system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; gap: 18px; padding: 32px; text-align: center; box-sizing: border-box; }
  .logo { font-family: Georgia, 'Times New Roman', serif; letter-spacing: .4em; font-size: 28px; color: #5E1D27; margin: 0; }
  p { margin: 0; line-height: 1.5; color: #5a4a44; }
  button { justify-self: center; min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: #5E1D27; color: #FAF6F0; font-size: 16px; }
</style>
</head>
<body>
<!-- Page locale affichée quand le site n'est pas joignable (pas de réseau). -->
<main>
  <p class="logo">LALLAT</p>
  <p id="texte">Pas de connexion internet.<br>Vérifiez votre réseau puis réessayez.</p>
  <button type="button" id="reessayer">Réessayer</button>
</main>
<script>
  if ((navigator.language || '').toLowerCase().indexOf('nl') === 0) {
    document.getElementById('texte').innerHTML = 'Geen internetverbinding.<br>Controleer uw netwerk en probeer opnieuw.';
    document.getElementById('reessayer').textContent = 'Opnieuw proberen';
  }
  document.getElementById('reessayer').addEventListener('click', function () {
    location.href = 'https://lalla-pearl.vercel.app/index.html?source=app';
  });
</script>
</body>
</html>
