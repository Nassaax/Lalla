# Fabrique l'application Android (fichier .aab pour Google Play), sans rien installer chez soi.
# Lancement : GitHub → Actions → « App Android » → Run workflow.
# Secrets à créer une fois (Settings → Secrets and variables → Actions) :
#   - ANDROID_KEYSTORE_BASE64   : contenu du fichier lallat-upload.keystore.b64
#   - ANDROID_KEYSTORE_PASSWORD : mot de passe de la clé
# Résultat : le fichier .aab à télécharger en bas de la page du workflow (« Artifacts »),
# puis à déposer dans la Google Play Console.
name: App Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version affichée (ex. 1.0)'
        default: '1.0'
        required: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node scripts/construire.mjs && npx cap sync android
      - name: Clé d'envoi Google Play
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Sans clé : fabrication non signée, utile pour vérifier que le projet compile.
          if [ -z "$KEYSTORE" ]; then echo "::warning::Secret ANDROID_KEYSTORE_BASE64 absent : .aab non signé (non publiable)"; exit 0; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/lallat.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lallat.keystore" >> "$GITHUB_ENV"
      - name: Fabrication du .aab signé
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version }}
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: lallat-android-${{ inputs.version }}-${{ github.run_number }}
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
