# Fabrique l'application iPhone / iPad et l'envoie sur App Store Connect (TestFlight), sur un Mac de GitHub.
# Lancement : GitHub → Actions → « App iOS » → Run workflow.
# Secrets à créer une fois (Settings → Secrets and variables → Actions) :
#   - APPLE_TEAM_ID              : identifiant d'équipe Apple (10 caractères, Membership details)
#   - APP_STORE_CONNECT_KEY_ID   : Key ID de la clé API (App Store Connect → Users and Access → Integrations)
#   - APP_STORE_CONNECT_ISSUER_ID: Issuer ID affiché au-dessus de la liste des clés
#   - APP_STORE_CONNECT_KEY_P8   : contenu complet du fichier AuthKey_XXXX.p8 (rôle Admin)
# La signature est gérée automatiquement par Apple (certificats « cloud »), aucun certificat à exporter.
name: App iOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version affichée (ex. 1.0)'
        default: '1.0'
        required: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      - name: Clé API App Store Connect
        id: cle
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [ -z "$P8" ]; then echo "present=non" >> "$GITHUB_OUTPUT"; echo "::warning::Secrets Apple absents : simple vérification sur simulateur, rien n'est envoyé"; exit 0; fi
          printf '%s' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "present=oui" >> "$GITHUB_OUTPUT"
      - name: Vérification sur simulateur (sans compte Apple)
        if: steps.cle.outputs.present == 'non'
        working-directory: app/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Archive signée
        if: steps.cle.outputs.present == 'oui'
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LALLAT.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
      - name: Envoi vers App Store Connect (TestFlight)
        if: steps.cle.outputs.present == 'oui'
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LALLAT.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
